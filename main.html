<!DOCTYPE html>

<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
	  <style>
        #grid {
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr; 
            grid-template-rows: 1fr 1fr 1fr 1fr 1fr; 
            gap: 10px;
            width: 800px;
            height: 600px;
            background-color: darkgreen;
            margin: 20px auto;
        }

        #grid > div {
            background-color: #38761d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }

        #grid > div:nth-child(1) {
            grid-column: 1 / 6;
            grid-row: 1;
        }

        #grid > div:nth-child(2) {
            grid-column: 1;
            grid-row: 2 / 5;
        }

        #grid > div:nth-child(3) {
            grid-column: 2 / 4; 
            grid-row: 2;
        }

        #grid > div:nth-child(4) {
            grid-column: 4 / 6;
            grid-row: 2;
        }

        #grid > div:nth-child(5) {
            grid-column: 2 / 4; 
            grid-row: 3;
        }

        #grid > div:nth-child(6) {
            grid-column: 4 / 6; 
            grid-row: 3;
        }

        #grid > div:nth-child(7) {
            grid-column: 2;
            grid-row: 4;
        }

        #grid > div:nth-child(8) {
            grid-column: 3;
            grid-row: 4;
        }

        #grid > div:nth-child(9) {
            grid-column: 4 / 6;
            grid-row: 4;
        }

        #grid > div:nth-child(10) {
            grid-column: 1 / 6;
            grid-row: 5;
        }
    </style>
  </head>

  <body>
    <body id="grid">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>10</div>
    </body>
    <script type="text/javascript" src="./script.js"></script>
  </body>
</html>
