<!DOCTYPE html>

<html>
<head>
    <title>CSS Grid Layout</title>
    <style>
        #grid {
            display: grid; 
            grid-template-rows: 124px 124px 124px 124px 124px; 
            grid-template-columns: 242.5px 242.5px 242.5px 242.5px; 
            grid-gap: 10px; 
            width: 1000px; 
            height: 660px;
            background-color: darkgreen;
            margin: 20px auto;
            
            grid-auto-rows: 0;
        }

        #grid > div {
            background-color: #38761d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }

       
        #grid > div:nth-child(1) {
            grid-column: span 4; 
            grid-row: 1;
        }

       
        #grid > div:nth-child(2) {
            grid-column: 1;
            grid-row: span 4; 
        }

       
        #grid > div:nth-child(3) {
            grid-column: 2 / span 2; 
            grid-row: 2;
        }

      
        #grid > div:nth-child(4) {
            grid-column: span 2; 
            grid-row: 2;
        }
        
       
        #grid > div:nth-child(5) {
            grid-column: span 2; 
            grid-row: 3;
        }

     
        #grid > div:nth-child(6) {
            grid-column: 4; 
            grid-row: 3;
        }

    
        #grid > div:nth-child(7) {
            grid-column: 2;
            grid-row: 4;
        }

     
        #grid > div:nth-child(8) {
            grid-column: 3;
            grid-row: 4;
        }

   
        #grid > div:nth-child(9) {
            grid-column: 4;
            grid-row: 4;
        }

    
        #grid > div:nth-child(10) {
            grid-column: span 3; 
            grid-row: 5;
        }
    </style>
</head>

<body> 
    <div id="grid">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>10</div>
    </div>
</body>
</html>
