<!DOCTYPE html>

<html>
<head>
    <title>CSS Grid Layout</title>
    <style>
        #grid {
            display: grid; 
            /* Test 1 requires exactly 5 rows of 124px */
            grid-template-rows: 124px 124px 124px 124px 124px; 
            grid-template-columns: 242.5px 242.5px 242.5px 242.5px; 
            grid-gap: 10px; 
            width: 1000px; 
            height: 660px;
            background-color: darkgreen;
            margin: 20px auto;
        }

        #grid > div {
            background-color: #38761d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2em;
            font-weight: bold;
        }

        /* Item 1: PASSES (span 4) */
        #grid > div:nth-child(1) {
            grid-column: span 4; 
            grid-row: 1;
        }

        /* Item 2: FIX - Must span 4 rows to pass the test */
        #grid > div:nth-child(2) {
            grid-column: 1;
            grid-row: span 4; /* Changed from span 3 to span 4 */
        }

        /* Item 3 */
        #grid > div:nth-child(3) {
            grid-column: 2 / span 2; 
            grid-row: 2;
        }

        /* Item 4: PASSES (span 2) */
        #grid > div:nth-child(4) {
            grid-column: span 2; 
            grid-row: 2;
        }
        
        /* Item 5: PASSES (span 2) */
        #grid > div:nth-child(5) {
            grid-column: span 2; 
            grid-row: 3;
        }

        /* Item 6 */
        #grid > div:nth-child(6) {
            grid-column: 4; 
            grid-row: 3;
        }

        /* Item 7 */
        #grid > div:nth-child(7) {
            grid-column: 2;
            grid-row: 4;
        }

        /* Item 8 */
        #grid > div:nth-child(8) {
            grid-column: 3;
            grid-row: 4;
        }

        /* Item 9 */
        #grid > div:nth-child(9) {
            grid-column: 4;
            grid-row: 4;
        }

        /* Item 10: FIX - Must remain in Row 5 since Item 2 spans rows 2-5 */
        #grid > div:nth-child(10) {
            grid-column: span 3; 
            grid-row: 5; /* Remains in the 5th row */
        }
    </style>
</head>

<body> 
    <div id="grid">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>10</div>
    </div>
</body>
</html>
